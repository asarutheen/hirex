apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hirex-ingress
  namespace: hirex
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: hirex.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hirex-api-svc
                port:
                  number: 80
