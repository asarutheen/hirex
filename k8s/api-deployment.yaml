apiVersion: apps/v1
kind: Deployment
metadata:
  name: hirex-api
  namespace: hirex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hirex-api
  template:
    metadata:
      labels:
        app: hirex-api
    spec:
      containers:
        - name: hirex-api
          image: asarutheen1997/hirex-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: NODE_ENV
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: JWT_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
---
apiVersion: v1
kind: Service
metadata:
  name: hirex-api-svc
  namespace: hirex
spec:
  selector:
    app: hirex-api
  ports:
    - port: 80
      targetPort: 3001
  type: ClusterIP
